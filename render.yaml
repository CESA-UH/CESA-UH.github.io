services:
  - type: web
    name: hamdars-cesa
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CLOUD_DEPLOYMENT
        value: "true"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: hamdars
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SITE_FILE_STORAGE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: hamdars-files
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@hamdars.local
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://ai.verbo.ir/v1
      - key: LLM_API_FORMAT
        value: chat_completions
      - key: LLM_MODELS
        value: cf/@cf/meta/llama-3.1-8b-instruct-fp8-fast,cf/@cf/meta/llama-3.2-3b-instruct
      - key: REPORT_LLM_MODELS
        value: cf/@cf/meta/llama-3.1-70b-instruct
      - key: REPORT_WORKER_ENABLED
        value: "true"
      - key: REPORT_WORKER_CONCURRENCY
        value: "1"
      - key: MAX_UPLOAD_BYTES
        value: "52428800"
